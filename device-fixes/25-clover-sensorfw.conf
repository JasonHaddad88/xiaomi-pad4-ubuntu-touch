; clover: the stock gate is orientationsensor=Feature_GyroSensor|Feature_AccelerationSensor
; and those feature probes fail on this port, so the sensor is never registered
; and the screen never rotates. Declare them available directly.
[available]
accelerometersensor=True
orientationsensor=True
alssensor=True
magnetometersensor=False
compasssensor=False
proximitysensor=False
