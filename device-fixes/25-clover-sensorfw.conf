; clover: sensorfw availability override.
; Install to /etc/sensorfw/sensord.conf.d/25-clover.conf
;
; sensorfw's stock 20-sensors-default.conf gates each sensor behind a feature
; probe:
;     orientationsensor=Feature_GyroSensor|Feature_AccelerationSensor
; Those probes fail on this port, so even though the accelerometer adaptor starts
; cleanly the orientation sensor is never registered, and every client request
; fails with:
;     SensorManagerError: "requested sensor id 'orientationsensor' not registered"
; which is why the screen never rotates.
;
; IMPORTANT: this must be a conf.d drop-in, NOT a SensorfwConfig replacement in
; deviceinfo. Pointing SensorfwConfig at a hand-written config replaces the whole
; stock chain and the sensor plugins stop being found altogether:
;     sensorfw: Plugin not available: "orientationsensor"
;
; magnetometer/compass/proximity are declared False because this tablet has
; none; leaving them on fills the log with instantiation failures.
;
; Added 2026-09-21. Delete this file to revert.
[available]
accelerometersensor=True
orientationsensor=True
alssensor=True
magnetometersensor=False
compasssensor=False
proximitysensor=False
