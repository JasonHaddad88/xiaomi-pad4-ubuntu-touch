[Service]
# clover: Halium base is Android 9 (no Codec2). QtWebEngine tries the Android
# media path, fails to load libstagefright_ccodec.so and segfaults the renderer.
Environment=QTWEBENGINE_CHROMIUM_FLAGS=--disable-accelerated-video-decode --disable-gpu-memory-buffer-video-frames --disable-features=VaapiVideoDecoder
