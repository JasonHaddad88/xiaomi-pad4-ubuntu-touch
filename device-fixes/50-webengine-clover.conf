# clover: force software video decoding in QtWebEngine (Morph browser).
# Install to ~/.config/environment.d/50-webengine-clover.conf
#
# Our Halium base is Android 9, which has no Codec2 ("ccodec") media stack.
# QtWebEngine attempts hardware-accelerated video decode through the Android
# media path, fails to load libstagefright_ccodec.so - an Android 10+ library -
# and the renderer dies immediately:
#
#   morph-browser: library "libstagefright_ccodec.so" not found
#   lomiri-app-launch--application-legacy--morph-browser--.service:
#       Main process exited, code=killed, status=11/SEGV
#
# So Morph appears to "crash after a few seconds" when in fact it crashes the
# moment a page starts playing video (e.g. YouTube).
#
# Cost: video decodes on the CPU, so heavy/high-resolution video will be less
# smooth and use more battery than hardware decode would - but hardware decode
# is not available on this base at all, so the alternative is a crash.
#
# Added 2026-09-21. Delete this file to revert.
QTWEBENGINE_CHROMIUM_FLAGS=--disable-accelerated-video-decode --disable-gpu-memory-buffer-video-frames
