# Bind the persist partition into the Android container as /persist.
# The Qualcomm sensor daemon refuses to start without
# /persist/sensors/sensors_settings ("check_sensors_enabled: Sensors enabled =
# false" -> "Timeout waiting for SMGR service"), so rotation/accelerometer are
# dead without this. The partition is mounted at /mnt/vendor/persist; LXC's own
# "lxc.mount.entry = /persist persist bind bind,optional" is skipped when that
# mount is not up yet at container start, so we do it here as well.
# Added 2026-09-20 during clover bring-up. Delete this file to revert.
description "bind persist into the android container (sensors)"

start on android
task

script
    # wait for the android container
    i=0
    while [ $i -lt 60 ]; do
        if lxc-info -n android 2>/dev/null | grep -q RUNNING; then break; fi
        sleep 1
        i=$((i+1))
    done

    # wait for android's own vendor fstab to bring persist up inside the container
    i=0
    while [ $i -lt 60 ]; do
        if lxc-attach --clear-env -n android -- /system/bin/ls /mnt/vendor/persist/sensors >/dev/null 2>&1; then break; fi
        sleep 1
        i=$((i+1))
    done

    # only bind if /persist is not already populated (LXC may have done it)
    if ! lxc-attach --clear-env -n android -- /system/bin/ls /persist/sensors >/dev/null 2>&1; then
        lxc-attach --clear-env -n android -- /system/bin/toybox mount -o bind /mnt/vendor/persist /persist || true
    fi

    # let the sensor daemons pick it up
    lxc-attach --clear-env -n android -- /system/bin/setprop ctl.restart vendor.sensors-hal-1-0 || true
    killall sensors.qcom 2>/dev/null || true
    sleep 8
    initctl restart sensorservice 2>/dev/null || true
    # sensorfw connects to android's sensorservice at start; it comes up long
    # before the sensors do, so it must be restarted after sensorservice or it
    # sits there logging "Poll failed status 2" and rotation never works.
    sleep 8
    initctl restart sensorfw 2>/dev/null || true
    # NB: do NOT restart repowerd here. sensorservice.conf's post-start already
    # does it right after the sensorservice restart above; doing it twice in the
    # same few seconds trips upstart's respawn limit and leaves repowerd in
    # stop/waiting - which kills the power button (screen never blanks).
end script
