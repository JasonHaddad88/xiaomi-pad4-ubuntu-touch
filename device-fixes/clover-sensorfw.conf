; sensorfw config for clover (Xiaomi Mi Pad 4), Ubuntu Touch 24.04.
; Installed to /etc/deviceinfo/sensorfw/clover.conf and referenced from
; /etc/deviceinfo/devices/clover.yaml via SensorfwConfig, the same way the
; pinephone/pinetab ports do it.
;
; Why the [available] block matters: sensorfw's stock 20-sensors-default.conf
; gates each sensor behind a feature probe -
;     orientationsensor=Feature_GyroSensor|Feature_AccelerationSensor
; and on this port those features are not detected, so even though the
; accelerometer adaptor starts cleanly, the orientation sensor is never
; registered and every client request fails with
;     SensorManagerError: "requested sensor id 'orientationsensor' not registered"
; which is exactly why the screen never rotates. Declaring them True skips the
; probe and registers them.
;
; magnetometer/compass are declared False on purpose: this tablet has none, and
; leaving them enabled fills the log with
;     "HYBRIS CTL invalid sensor type: 2" / "magnetometersensor instantiation failed"
;
; Added 2026-09-21. Delete this file (and the SensorfwConfig line) to revert.

[plugins]
accelerometeradaptor = hybrisaccelerometeradaptor
alsadaptor = hybrisalsadaptor
gyroscopeadaptor = hybrisgyroscopeadaptor
orientationadaptor = hybrisorientationadaptor

[available]
accelerometersensor=True
orientationsensor=True
alssensor=True
gyroscopesensor=True
magnetometersensor=False
compasssensor=False
proximitysensor=False
rotationsensor=True

[accelerometer]
transformation_matrix = "1,0,0,0,1,0,0,0,1"
