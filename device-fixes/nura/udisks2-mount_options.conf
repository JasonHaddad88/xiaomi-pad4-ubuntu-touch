# Constrain how Ubuntu Touch may mount the Nura SD card.
#
# WHY
# UT runs a 4.4 kernel. The card's filesystem has orphan_file, which is a
# COMPAT feature, so 4.4 mounts it READ-WRITE and silently ignores the orphan
# file, then ext4 replays the journal. That corrupted the card before - e2fsck
# once saw 12 files where there were 33,151, and Nura booted to a black screen.
#
# WHAT DOES NOT WORK, both verified on this device:
#   - ENV{UDISKS_IGNORE}="1" and ENV{UDISKS_AUTO}="0" udev rules. Both
#     properties were confirmed applied, and udisks2 mounted the card rw anyway.
#   - noauto entries in /etc/fstab. Ubuntu Touch regenerates /etc/fstab on every
#     boot, so the entries vanish.
#
# So the mount is not prevented, it is constrained: ro,noload as the default,
# and an allow list containing no rw, so a read-write request is refused.
# noload is what actually suppresses the journal replay; plain ro does not.
#
# pmOS_root = f08d5deb-0d48-431d-8b20-f12f896c5c9a
# pmOS_boot = ecff7085-c21a-4ff0-afff-122faf711732

[/dev/disk/by-uuid/f08d5deb-0d48-431d-8b20-f12f896c5c9a]
ext4_defaults=ro,noload
ext4_allow=ro,noload,errors,nosuid,nodev,relatime

[/dev/disk/by-uuid/ecff7085-c21a-4ff0-afff-122faf711732]
ext2_defaults=ro
ext2_allow=ro,errors,nosuid,nodev,relatime
