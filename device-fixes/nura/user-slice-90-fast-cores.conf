# Confine the interactive user session to clover's genuinely faster CPU cores.
#
# WHY
# Mainline SDM660 has no CPU frequency scaling, and the bootloader leaves the
# two clusters at very different fixed clocks. Measured with openssl AES-128-CBC
# at 16 KB blocks, one core at a time on an idle system:
#
#   cpu1-4  Kryo 260 Gold (A73), capacity 1024:   476 MB/s
#   cpu0,5-7 Silver (A53),       capacity  640:  1035 MB/s
#
# So the cores the scheduler is told are the fast ones deliver less than half
# the throughput. capacity-dmips-mhz is correct by microarchitecture - the A73
# really is the bigger core - but it is wrong about delivered performance here,
# because the A73 cluster is stuck at a low clock.
#
# cpu_capacity in sysfs is read-only, so the hint cannot be corrected at
# runtime. Confining the user session is the next best thing: interactive apps
# get the fast cores, while system and background services keep all eight.
#
# Unpinned AES throughput went from 476 MB/s to 1038 MB/s with this applied.
#
# TRADE-OFF: user apps can no longer use the Gold cluster at all, so heavily
# parallel user workloads lose four (slower) cores. For UI responsiveness on a
# tablet that is the right trade.
#
# REVERT: delete this file and run `systemctl daemon-reload`, then reboot.
#
# PROPER FIX: upstream cpufreq for SDM660 (OSM at 0x179c0000, CPRh at
# 0x179c4000/0x179c8000) would let the Gold cluster reach 2.46 GHz and make it
# genuinely the fastest, at which point this file should be deleted.
[Slice]
AllowedCPUs=0,5-7
