# clover sensor bring-up: rotation AND screen turn-off.
#
# WHY THIS IS NEEDED
# Stock Ubuntu Touch expects one client on the sensors HAL: sensorfw, which
# serves Lomiri (rotation) and repowerd (light/proximity) over D-Bus. But the
# repowerd in this rootfs still binds android's binder 'sensorservice' at
# startup - it sits in "Waiting for service 'sensorservice' on /dev/binder"
# forever, never registers com.canonical.Unity.Screen, and then the display can
# be neither blanked nor woken: the power button appears dead.
#
# Android's sensorservice is a second HAL client, and this vendor HAL does not
# like that (vendor.sensors-hal-1-0 restarts when both are attached). But
# repowerd only needs sensorservice to exist long enough to BIND. Afterwards it
# keeps serving com.canonical.Unity.Screen, and the panel blanks and wakes
# normally, with sensorservice gone and sensorfw owning the HAL again.
#
# So: bring sensorservice up, WAIT UNTIL repowerd has actually registered on
# D-Bus (verify the capability, not a proxy for it), then take it away and give
# the HAL back to sensorfw.
#
# Triggered by repowerd itself, so it also re-arms if repowerd ever restarts -
# otherwise repowerd would block forever on a sensorservice that is gone.
#
# One-shot task on purpose: Ubuntu Touch's watchdog REBOOTS THE DEVICE when an
# upstart job hits its respawn limit, so nothing here may ever flap.
#
# Added 2026-09-20 during clover bring-up. Delete this file to revert.
description "clover sensor bring-up (rotation + screen turn-off)"

start on started repowerd
task

script
    SCREEN_OK() {
        dbus-send --system --print-reply --dest=com.canonical.Unity.Screen \
            /com/canonical/Unity/Screen org.freedesktop.DBus.Introspectable.Introspect \
            >/dev/null 2>&1
    }

    # 1. wait for the android container
    i=0
    while [ $i -lt 60 ]; do
        lxc-info -n android 2>/dev/null | grep -q RUNNING && break
        sleep 1
        i=$((i+1))
    done

    # 2. /persist must reach the container or the Qualcomm sensor daemon gates
    #    out ("Sensors enabled = false" -> "Timeout waiting for SMGR service")
    #    and android reports "No Sensors on the device" - no rotation.
    i=0
    while [ $i -lt 60 ]; do
        lxc-attach --clear-env -n android -- /system/bin/ls /mnt/vendor/persist/sensors >/dev/null 2>&1 && break
        sleep 1
        i=$((i+1))
    done
    if ! lxc-attach --clear-env -n android -- /system/bin/ls /persist/sensors >/dev/null 2>&1; then
        lxc-attach --clear-env -n android -- /system/bin/toybox mount -o bind /mnt/vendor/persist /persist || true
        lxc-attach --clear-env -n android -- /system/bin/setprop ctl.restart vendor.sensors-hal-1-0 || true
    fi

    # 3. wait for the sensors HAL, then let it settle
    i=0
    while [ $i -lt 60 ]; do
        [ "$(lxc-attach --clear-env -n android -- /system/bin/getprop init.svc.vendor.sensors-hal-1-0 2>/dev/null | tr -d '\r')" = "running" ] && break
        sleep 1
        i=$((i+1))
    done
    sleep 5

    # 4. give the waiting repowerd a sensorservice to bind to
    if ! SCREEN_OK; then
        setsid lxc-attach --clear-env -n android -- /system/bin/sensorservice </dev/null >/dev/null 2>&1 &

        # 5. wait until the display service is REALLY there (not a proxy check)
        i=0
        while [ $i -lt 60 ]; do
            SCREEN_OK && break
            sleep 1
            i=$((i+1))
        done
    fi

    # 6. hand the HAL back to sensorfw, but only if screen control came up -
    #    otherwise leave sensorservice running, because a working power button
    #    matters more than rotation.
    if SCREEN_OK; then
        lxc-attach --clear-env -n android -- /system/bin/killall sensorservice 2>/dev/null || true
        sleep 3
        initctl restart sensorfw 2>/dev/null || true
    fi
end script
