# One-shot sensor bring-up for clover: screen-off AND rotation together.
#
# Two facts make this necessary:
#
#   1. repowerd blocks on binder waiting for android's 'sensorservice' and can
#      never blank the display without it. Halium has no framework to start it.
#   2. sensorservice and sensorfw cannot both hold the sensors HAL. With both
#      running, vendor.sensors-hal-1-0 exits with status 255 every ~5s and
#      sensorservice dies with "Abort due to ISensors hidl service failure ...
#      DEAD_OBJECT". With sensorservice gone the HAL is stable for hours.
#
# repowerd only needs sensorservice to exist when it *starts*: it keeps working
# (and keeps answering on com.canonical.Unity.Screen) after sensorservice goes
# away. So we start sensorservice, let repowerd bind, then kill it and hand the
# HAL back to sensorfw, which is what rotation needs.
#
# This is a task on purpose - it runs once and exits. It must NEVER be a
# respawning service: Ubuntu Touch's watchdog reboots the whole device when an
# upstart job hits its respawn limit ("watchdog: 'sensorservice' hit respawn
# limit - rebooting"), and because sensorservice crash-loops whenever the HAL
# goes away, an earlier version of this fix turned the tablet into a boot loop -
# stuck on the Ubuntu logo, or flickering and switching off.
#
# Added 2026-09-20 during clover bring-up. Delete this file to revert.
description "clover sensor bring-up (persist, screen-off, rotation)"

# Triggered by repowerd itself, not by the 'android' event. repowerd blocks on
# binder until sensorservice appears, so this runs *while* it is waiting and
# unblocks it - no repowerd restart needed (one less display flicker at boot).
# It also means a later repowerd restart is handled automatically: without this,
# repowerd would block forever on a sensorservice that no longer exists, leaving
# the screen unwakeable with the power button dead.
start on started repowerd
task

script
    # 1. wait for the android container
    i=0
    while [ $i -lt 60 ]; do
        lxc-info -n android 2>/dev/null | grep -q RUNNING && break
        sleep 1
        i=$((i+1))
    done

    # 2. Make sure /persist reached the container. The Qualcomm sensor daemon
    #    refuses to start without /persist/sensors/sensors_settings ("Sensors
    #    enabled = false" -> "Timeout waiting for SMGR service"), which is why
    #    android reported "No Sensors on the device". LXC binds it via
    #    "lxc.mount.entry = /persist persist bind bind,optional" when the
    #    partition is already mounted at container start; if not, bind it here.
    i=0
    while [ $i -lt 60 ]; do
        lxc-attach --clear-env -n android -- /system/bin/ls /mnt/vendor/persist/sensors >/dev/null 2>&1 && break
        sleep 1
        i=$((i+1))
    done
    if ! lxc-attach --clear-env -n android -- /system/bin/ls /persist/sensors >/dev/null 2>&1; then
        lxc-attach --clear-env -n android -- /system/bin/toybox mount -o bind /mnt/vendor/persist /persist || true
        lxc-attach --clear-env -n android -- /system/bin/setprop ctl.restart vendor.sensors-hal-1-0 || true
        sleep 5
    fi

    # 3. start sensorservice so the waiting repowerd can bind to it
    setsid lxc-attach --clear-env -n android -- /system/bin/sensorservice </dev/null >/dev/null 2>&1 &
    i=0
    while [ $i -lt 30 ]; do
        lxc-attach --clear-env -n android -- /system/bin/service check sensorservice 2>/dev/null | grep -q ": found" && break
        sleep 1
        i=$((i+1))
    done

    # 4. give repowerd time to bind and finish initialising. Verified: once it
    #    has bound it keeps its input devices open and keeps serving
    #    com.canonical.Unity.Screen after sensorservice goes away.
    sleep 15

    # 5. take sensorservice away again and give the HAL back to sensorfw
    lxc-attach --clear-env -n android -- /system/bin/killall sensorservice 2>/dev/null || true
    sleep 3
    lxc-attach --clear-env -n android -- /system/bin/setprop ctl.restart vendor.sensors-hal-1-0 || true
    sleep 8
    initctl restart sensorfw 2>/dev/null || true
end script
