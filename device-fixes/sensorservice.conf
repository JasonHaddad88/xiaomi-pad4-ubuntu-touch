# Android sensorservice for Halium.
# repowerd blocks forever waiting for this binder service ("Waiting for service
# 'sensorservice' on /dev/binder"), so the display can never be turned off.
# Halium has no Android framework to start it, so we start it here.
# Added 2026-09-20 during clover bring-up. Delete this file to revert.
description "Android sensorservice (required by repowerd)"

start on android
stop on stopping lxc-android-config
respawn
respawn limit 20 120

pre-start script
    # wait for the android container to be running before attaching to it
    i=0
    while [ $i -lt 60 ]; do
        if lxc-info -n android 2>/dev/null | grep -q RUNNING; then break; fi
        sleep 1
        i=$((i+1))
    done
end script

exec lxc-attach --clear-env -n android -- /system/bin/sensorservice

post-start script
    # repowerd usually starts (and stalls) before sensorservice is up
    sleep 3
    initctl restart repowerd || true
end script
