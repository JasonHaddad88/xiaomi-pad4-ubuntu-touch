# Android sensorservice for Halium (clover) - required for screen turn-off.
#
# repowerd blocks on binder waiting for 'sensorservice' ("Waiting for service
# 'sensorservice' on /dev/binder"), never registers com.canonical.Unity.Screen,
# and the display can then never be blanked or woken - the power button does
# nothing. Halium has no Android framework to start it, so we do.
#
# TWO HARD RULES ARE ENCODED HERE, both learned the painful way:
#
# 1. Upstart must never see this job exit. Ubuntu Touch's watchdog REBOOTS THE
#    DEVICE when a job hits its respawn limit ("watchdog: 'sensorservice' hit
#    respawn limit - rebooting"). sensorservice does crash-loop when the sensors
#    HAL goes away, so an "exec ... " + "respawn" version turned the tablet into
#    a boot loop. Here the job's main process is the shell below, which loops
#    forever and never exits, so upstart never respawns anything.
#
# 2. Do not kill sensorservice once it is up. sensorservice and sensorfw cannot
#    both hold the sensors HAL (vendor.sensors-hal-1-0 exits with status 255
#    every ~5s when both run), and an earlier version worked around that by
#    killing sensorservice ~16s after boot - which blanked the screen ~16s into
#    the session and left the power button dead. sensorfw is disabled instead
#    (see sensorfw.override); that costs rotation, which is the lesser loss.
#
# Added 2026-09-20 during clover bring-up. Delete this file to revert.
description "Android sensorservice (required by repowerd)"

start on android
stop on stopping lxc-android-config

script
    # wait for the android container
    i=0
    while [ $i -lt 60 ]; do
        lxc-info -n android 2>/dev/null | grep -q RUNNING && break
        sleep 1
        i=$((i+1))
    done

    # Make sure /persist reached the container, or the Qualcomm sensor daemon
    # refuses to start ("Sensors enabled = false" -> "Timeout waiting for SMGR
    # service") and android reports "No Sensors on the device". LXC binds it
    # when the partition is mounted at container start; if not, do it here.
    if ! lxc-attach --clear-env -n android -- /system/bin/ls /persist/sensors >/dev/null 2>&1; then
        lxc-attach --clear-env -n android -- /system/bin/toybox mount -o bind /mnt/vendor/persist /persist || true
        lxc-attach --clear-env -n android -- /system/bin/setprop ctl.restart vendor.sensors-hal-1-0 || true
        sleep 5
    fi

    # Supervise sensorservice ourselves - see rule 1 above. repowerd is already
    # blocked waiting for it and unblocks on its own as soon as it registers,
    # so no repowerd restart is needed here (that used to flicker the display).
    while true; do
        lxc-attach --clear-env -n android -- /system/bin/sensorservice
        sleep 15
    done
end script
