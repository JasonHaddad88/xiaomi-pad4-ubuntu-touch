# clover: Android sensorservice + sensor bring-up.
#
# WHY SENSORSERVICE MUST RUN, AND MUST NEVER BE KILLED
# repowerd picks its proximity backend in this order (from `strings repowerd`):
#     SensorfwProximitySensor  ->  UbuntuProximitySensor  ->  NullProximitySensor
# This tablet has NO proximity sensor, so the sensorfw one fails ("sensor has
# not been instantiated" in sensorfw's log) and repowerd falls through to the
# Ubuntu/UAL one - which does not fail, it BLOCKS forever in
# "Waiting for service 'sensorservice' on /dev/binder". While blocked repowerd
# never registers com.canonical.Unity.Screen, so the display can be neither
# blanked nor woken and the power button looks dead.
#
# Worse, if sensorservice goes away *after* repowerd bound to it, repowerd exits
# and upstart respawns it straight back into that blocked state. An earlier
# version of this fix killed sensorservice on purpose to free the HAL for
# sensorfw, which produced exactly that loop: a few usable seconds, screen off,
# random returns. So: start it, keep it, never kill it.
#
# sensorfw (rotation) is a second client of the same HAL. The HAL restarts a few
# times while both attach and then settles.
#
# The job's main process is the shell loop below, which never exits, so upstart
# never respawns it. That matters: Ubuntu Touch's watchdog REBOOTS THE DEVICE
# when a job hits its respawn limit ("watchdog: 'sensorservice' hit respawn
# limit - rebooting"), which is what turned an earlier version into a boot loop.
#
# Added 2026-09-20 during clover bring-up. Delete this file to revert.
description "Android sensorservice (repowerd) + sensor bring-up"

start on android
stop on stopping lxc-android-config

script
    # wait for the android container
    i=0
    while [ $i -lt 60 ]; do
        lxc-info -n android 2>/dev/null | grep -q RUNNING && break
        sleep 1
        i=$((i+1))
    done

    # /persist must reach the container or the Qualcomm sensor daemon gates out
    # ("Sensors enabled = false" -> "Timeout waiting for SMGR service") and
    # android reports "No Sensors on the device" - no rotation, no light sensor.
    if ! lxc-attach --clear-env -n android -- /system/bin/ls /persist/sensors >/dev/null 2>&1; then
        lxc-attach --clear-env -n android -- /system/bin/toybox mount -o bind /mnt/vendor/persist /persist || true
        lxc-attach --clear-env -n android -- /system/bin/setprop ctl.restart vendor.sensors-hal-1-0 || true
        sleep 5
    fi

    # sensorfw starts before the sensors exist and then only logs "Poll failed
    # status 2" forever; one restart once the HAL is up gives it the sensors.
    (
        i=0
        while [ $i -lt 60 ]; do
            [ "$(lxc-attach --clear-env -n android -- /system/bin/getprop init.svc.vendor.sensors-hal-1-0 2>/dev/null | tr -d '\r')" = "running" ] && break
            sleep 1
            i=$((i+1))
        done
        sleep 10
        initctl restart sensorfw 2>/dev/null || true
    ) &

    # Supervise sensorservice here, never under upstart's respawn - see above.
    while true; do
        lxc-attach --clear-env -n android -- /system/bin/sensorservice
        sleep 10
    done
end script
